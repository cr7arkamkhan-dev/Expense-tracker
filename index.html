<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        header {
            background: var(--surface);
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-secondary {
            background: #64748b;
        }

        /* Bottom Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }

        nav button.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* Modal / Statement View */
        .modal {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid var(--border);
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .amount-danger { color: var(--danger); font-weight: 600; }
        .amount-success { color: var(--success); font-weight: 600; }
    </style>
</head>
<body>

    <header>Personal Expense Tracker</header>

    <div class="container">
        <div class="card">
            <h3>Summary & Reports</h3>
            <p style="color: var(--text-muted); margin: 8px 0 16px 0;">Export your financial data easily.</p>
            <button class="btn" onclick="exportCSV()">Export Statement (CSV)</button>
        </div>

        <div class="modal">
            <h3 style="margin-bottom: 12px;">Recent Transactions</h3>
            <div id="transactionList">
                <!-- Transactions will load dynamically -->
            </div>
        </div>
    </div>

    <nav>
        <button class="active">Overview</button>
        <button>Income</button>
        <button>Expense</button>
        <button>Savings</button>
        <button>Invest</button>
        <button>P&L</button>
    </nav>

    <script>
        // Sample data loader & robust mobile-friendly CSV export
        function getTransactions() {
            let data = localStorage.getItem('transactions');
            if (!data) {
                // Default placeholder data if empty
                const initial = [
                    { category: 'Cigarettes', note: 'Chacha', amount: -25, type: 'expense' },
                    { category: 'Petrol', note: 'Petrol', amount: -150, type: 'expense' },
                    { category: 'Food & Dining', note: 'Seekh Paratha', amount: -370, type: 'expense' },
                    { category: 'Salary', note: 'Monthly', amount: 28063, type: 'income' }
                ];
                localStorage.setItem('transactions', JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function renderTransactions() {
            const list = document.getElementById('transactionList');
            const txs = getTransactions();
            list.innerHTML = '';
            
            txs.forEach(tx => {
                const div = document.createElement('div');
                div.className = 'transaction-item';
                div.innerHTML = `
                    <div>
                        <strong>${tx.category}</strong><br>
                        <small style="color: var(--text-muted);">${tx.note || ''}</small>
                    </div>
                    <div class="${tx.amount < 0 ? 'amount-danger' : 'amount-success'}">
                        ${tx.amount < 0 ? '-' : '+'}&#8377;${Math.abs(tx.amount).toFixed(2)}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function exportCSV() {
            const txs = getTransactions();
            let csvContent = "Category,Note,Amount,Type\n";
            
            txs.forEach(tx => {
                let row = `"${tx.category}","${tx.note || ''}",${tx.amount},"${tx.type}"\n`;
                csvContent += row;
            });

            // Create Blob and handle download safely for iOS Safari & PWAs
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "expense_statement.csv");
            document.body.appendChild(link);
            
            try {
                link.click();
            } catch (e) {
                // Fallback for strict mobile environments
                window.open(url, '_blank');
            }
            
            document.body.removeChild(link);
        }

        // Initialize view on load
        renderTransactions();
    </script>
</body>
</html>
